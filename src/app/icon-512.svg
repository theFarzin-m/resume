<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- گروه اصلی با ضریب مقیاس ۱۶ برابر -->
  <g transform="scale(16)">
    <!-- پس‌زمینه تیره -->
    <rect width="32" height="32" rx="8" fill="#0b0f19" />
    <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="url(#brandGradient512)" stroke-opacity="0.2" stroke-width="1" />

    <!-- مونوگرام F و M -->
    <path
      d="M 8 8 H 18 M 8 8 V 24 M 8 15.5 H 14 L 18 22 L 22 15.5 V 24"
      stroke="url(#brandGradient512)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- آپاستروف farzin'm -->
    <path
      d="M 22 7.5 C 22.5 6, 24 6.5, 23.5 8 C 23 9.5, 21.5 10, 21.5 10.5"
      stroke="#38bdf8"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />
